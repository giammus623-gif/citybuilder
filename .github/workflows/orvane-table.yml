name: Orvane Table

on:
  push:
    paths:
      - "orvane-table/**"
      - ".github/workflows/orvane-table.yml"
  pull_request:
    paths:
      - "orvane-table/**"
      - ".github/workflows/orvane-table.yml"

jobs:
  controlla:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orvane-table
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orvane-table/package-lock.json
      - run: npm ci
      - run: npm run controlla
      - run: npm run siti
